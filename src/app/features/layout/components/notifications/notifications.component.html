<div class="notif-panel card fade-in">
  <div class="notif-header">
    <h3>Notifications</h3>
    <div class="notif-actions">
      @if (service.unreadCount() > 0) {
        <button class="text-btn" (click)="service.markAllRead()">
          Mark all read
        </button>
      }
      <button class="icon-btn-sm" (click)="closed.emit()">
        <span class="material-icons sm">close</span>
      </button>
    </div>
  </div>

  <div class="notif-list">
    @if (service.notifications().length === 0) {
      <div class="empty-state">
        <span class="material-icons">notifications_none</span>
        <p>All caught up!</p>
      </div>
    }

    @for (n of service.notifications(); track n) {
     <div
        class="notif-item"
        [class.unread]="!n.read"
        [class]="'notif-item type-' + n.type"
        role="button"
        tabindex="0"
        (click)="service.markAsRead(n.id)"
        (keydown.enter)="service.markAsRead(n.id)"
        (keydown.space)="service.markAsRead(n.id)">
        <div class="notif-icon" [class]="'icon-' + n.type">
          <span class="material-icons sm">{{ iconMap[n.type] }}</span>
        </div>
        <div class="notif-body">
          <p class="notif-title">{{ n.title }}</p>
          <p class="notif-msg">{{ n.message }}</p>
          <span class="notif-time">{{ timeAgo(n.timestamp) }}</span>
        </div>
        <button class="dismiss-btn" (click)="$event.stopPropagation(); service.dismiss(n.id)">
          <span class="material-icons sm">close</span>
        </button>
      </div>
    }
  </div>
</div>
